<?xml version="1.0" encoding="UTF-8"?>
<!-- Managed execution sequence. The local policy and watchdog continue while the agent observes or waits for a model response. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800"
 font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" role="img" aria-labelledby="title desc">
<title id="title">NERV managed skill execution</title>
<desc id="desc">A skill returns an execution ID at startup. The agent observes and supervises while the worker runs the local policy. Local faults and emergency stop do not wait for the model. Results are checked before reporting an outcome.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#374151"/></marker><marker id="stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b91c1c"/></marker></defs>
<rect width="1100" height="800" fill="#f8f9fb"/>
<rect x="20" y="90" width="270" height="640" rx="8" fill="#fdf2e9" stroke="#b45309" stroke-opacity=".25"/><rect x="20" y="20" width="270" height="50" rx="8" fill="#b45309"/>
<text x="155.0" y="42" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="700">System 2 · Agent harness</text>
<text x="155.0" y="60" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="400">model provider · memory · context</text>
<rect x="300" y="90" width="270" height="640" rx="8" fill="#e8f0fe" stroke="#1a4d8f" stroke-opacity=".25"/><rect x="300" y="20" width="270" height="50" rx="8" fill="#1a4d8f"/>
<text x="435.0" y="42" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="700">NERV host</text>
<text x="435.0" y="60" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="400">permissions · observations · durable log</text>
<rect x="580" y="90" width="270" height="640" rx="8" fill="#e9f7ef" stroke="#15803d" stroke-opacity=".25"/><rect x="580" y="20" width="270" height="50" rx="8" fill="#15803d"/>
<text x="715.0" y="42" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="700">System 1 · Robot runtime</text>
<text x="715.0" y="60" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="400">independent worker · local policy</text>
<rect x="860" y="90" width="220" height="640" rx="8" fill="#f3f0fa" stroke="#6d28d9" stroke-opacity=".25"/><rect x="860" y="20" width="220" height="50" rx="8" fill="#6d28d9"/>
<text x="970.0" y="42" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="700">World / environment</text>
<text x="970.0" y="60" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="400">simulation or real hardware</text>
<rect x="80" y="110" width="180" height="70" rx="7" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
<text x="170.0" y="132" text-anchor="middle" font-size="13" fill="#b45309" font-weight="600">Instruction + context</text>
<text x="170.0" y="152" text-anchor="middle" font-size="12" fill="#374151" font-weight="400">session history and notes</text>
<text x="170.0" y="172" text-anchor="middle" font-size="12" fill="#374151" font-weight="400">current observations</text>
<rect x="335" y="110" width="200" height="70" rx="7" fill="#ffffff" stroke="#1a4d8f" stroke-width="1.5"/>
<text x="435.0" y="132" text-anchor="middle" font-size="13" fill="#1a4d8f" font-weight="600">Assemble observation</text>
<text x="435.0" y="152" text-anchor="middle" font-size="12" fill="#374151" font-weight="400">named sensors / frame times</text>
<text x="435.0" y="172" text-anchor="middle" font-size="12" fill="#374151" font-weight="400">no simulator ground truth</text>
<rect x="615" y="110" width="200" height="70" rx="7" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
<text x="715.0" y="132" text-anchor="middle" font-size="13" fill="#15803d" font-weight="600">Shared acquisition</text>
<text x="715.0" y="152" text-anchor="middle" font-size="12" fill="#374151" font-weight="400">camera streams + state</text>
<text x="715.0" y="172" text-anchor="middle" font-size="12" fill="#374151" font-weight="400">same source as policy input</text>
<rect x="880" y="110" width="180" height="70" rx="7" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="970.0" y="132" text-anchor="middle" font-size="13" fill="#6d28d9" font-weight="600">Sense environment</text>
<text x="970.0" y="152" text-anchor="middle" font-size="12" fill="#374151" font-weight="400">cameras / joints</text>
<text x="970.0" y="172" text-anchor="middle" font-size="12" fill="#374151" font-weight="400">sim bus or native driver</text>
<line x1="880" y1="145" x2="815" y2="145" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="847.5" y="131" text-anchor="middle" font-size="10" fill="#374151" font-weight="400">read</text>
<line x1="615" y1="145" x2="535" y2="145" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="575.0" y="131" text-anchor="middle" font-size="10" fill="#374151" font-weight="400">frames</text>
<line x1="335" y1="145" x2="260" y2="145" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="297.5" y="131" text-anchor="middle" font-size="10" fill="#374151" font-weight="400">observe</text>
<rect x="80" y="210" width="180" height="60" rx="7" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
<text x="170.0" y="229" text-anchor="middle" font-size="13" fill="#b45309" font-weight="600">Model decision</text>
<text x="170.0" y="246" text-anchor="middle" font-size="12" fill="#374151" font-weight="400">choose a declared skill</text>
<rect x="335" y="210" width="200" height="60" rx="7" fill="#ffffff" stroke="#1a4d8f" stroke-width="1.5"/>
<text x="435.0" y="229" text-anchor="middle" font-size="13" fill="#1a4d8f" font-weight="600">Persist + gate</text>
<text x="435.0" y="246" text-anchor="middle" font-size="12" fill="#374151" font-weight="400">live generation? armed?</text>
<text x="435.0" y="263" text-anchor="middle" font-size="12" fill="#374151" font-weight="400">tool allowed? valid args?</text>
<rect x="615" y="210" width="200" height="60" rx="7" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
<text x="715.0" y="229" text-anchor="middle" font-size="13" fill="#15803d" font-weight="600">Start managed skill</text>
<text x="715.0" y="246" text-anchor="middle" font-size="12" fill="#374151" font-weight="400">check token before dispatch</text>
<line x1="260" y1="240" x2="335" y2="240" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="297.5" y="226" text-anchor="middle" font-size="10" fill="#374151" font-weight="400">call</text>
<line x1="535" y1="240" x2="615" y2="240" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="575.0" y="226" text-anchor="middle" font-size="10" fill="#374151" font-weight="400">start</text>
<path d="M715 270 V297 H615" fill="none" stroke="#374151" stroke-width="1.5"/>
<line x1="615" y1="297" x2="335" y2="297" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="475.0" y="283" text-anchor="middle" font-size="10" fill="#374151" font-weight="400">execution ID / start result</text>
<line x1="335" y1="297" x2="160" y2="297" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="715" y1="297" x2="715" y2="325" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="615" y="325" width="200" height="195" rx="7" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
<text x="715.0" y="347" text-anchor="middle" font-size="13" fill="#15803d" font-weight="600">Local policy loop</text>
<text x="715.0" y="367" text-anchor="middle" font-size="12" fill="#374151" font-weight="400">read shared sensors</text>
<text x="715.0" y="387" text-anchor="middle" font-size="12" fill="#374151" font-weight="400">run policy / controller</text>
<text x="715.0" y="407" text-anchor="middle" font-size="12" fill="#374151" font-weight="400">dispatch guarded targets</text>
<text x="715.0" y="427" text-anchor="middle" font-size="12" fill="#374151" font-weight="400">repeat at configured rate</text>
<text x="715.0" y="447" text-anchor="middle" font-size="12" fill="#374151" font-weight="400">check camera freshness</text>
<text x="715.0" y="467" text-anchor="middle" font-size="12" fill="#374151" font-weight="400">check supervision deadline</text>
<text x="715.0" y="487" text-anchor="middle" font-size="12" fill="#374151" font-weight="400">stop locally on fault</text>
<rect x="880" y="365" width="180" height="100" rx="7" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="970.0" y="387" text-anchor="middle" font-size="13" fill="#6d28d9" font-weight="600">Actuate + sense</text>
<text x="970.0" y="407" text-anchor="middle" font-size="12" fill="#374151" font-weight="400">simulation steps</text>
<text x="970.0" y="427" text-anchor="middle" font-size="12" fill="#374151" font-weight="400">or real servos</text>
<text x="970.0" y="447" text-anchor="middle" font-size="12" fill="#374151" font-weight="400">fresh sensor readings</text>
<line x1="815" y1="390" x2="880" y2="390" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="847.5" y="376" text-anchor="middle" font-size="10" fill="#374151" font-weight="400">write</text>
<line x1="880" y1="445" x2="815" y2="445" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="847.5" y="431" text-anchor="middle" font-size="10" fill="#374151" font-weight="400">read</text>
<rect x="80" y="355" width="180" height="85" rx="7" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
<text x="170.0" y="377" text-anchor="middle" font-size="13" fill="#b45309" font-weight="600">Observe + reassess</text>
<text x="170.0" y="397" text-anchor="middle" font-size="12" fill="#374151" font-weight="400">query execution state</text>
<text x="170.0" y="417" text-anchor="middle" font-size="12" fill="#374151" font-weight="400">continue, cancel or finish</text>
<rect x="335" y="355" width="200" height="85" rx="7" fill="#ffffff" stroke="#1a4d8f" stroke-width="1.5"/>
<text x="435.0" y="377" text-anchor="middle" font-size="13" fill="#1a4d8f" font-weight="600">Execution supervision</text>
<text x="435.0" y="397" text-anchor="middle" font-size="12" fill="#374151" font-weight="400">fresh observation receipts</text>
<text x="435.0" y="417" text-anchor="middle" font-size="12" fill="#374151" font-weight="400">renew after model response</text>
<line x1="615" y1="380" x2="535" y2="380" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="575.0" y="366" text-anchor="middle" font-size="10" fill="#374151" font-weight="400">status</text>
<line x1="335" y1="400" x2="260" y2="400" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="297.5" y="386" text-anchor="middle" font-size="10" fill="#374151" font-weight="400">frames</text>
<line x1="535" y1="455" x2="615" y2="455" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<text x="575.0" y="441" text-anchor="middle" font-size="10" fill="#374151" font-weight="400">renew</text>
<text x="435" y="491" text-anchor="middle" font-size="11" fill="#1a4d8f" font-weight="400">Local watchdog stays active</text>
<text x="435" y="508" text-anchor="middle" font-size="11" fill="#1a4d8f" font-weight="400">while the model is pending.</text>
<rect x="80" y="550" width="180" height="60" rx="7" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
<text x="170.0" y="569" text-anchor="middle" font-size="13" fill="#b45309" font-weight="600">Cancel when needed</text>
<text x="170.0" y="586" text-anchor="middle" font-size="12" fill="#374151" font-weight="400">new instructions invalidate</text>
<text x="170.0" y="603" text-anchor="middle" font-size="12" fill="#374151" font-weight="400">old model decisions</text>
<rect x="335" y="550" width="200" height="60" rx="7" fill="#ffffff" stroke="#1a4d8f" stroke-width="1.5"/>
<text x="435.0" y="569" text-anchor="middle" font-size="13" fill="#1a4d8f" font-weight="600">Revoke + stop</text>
<text x="435.0" y="586" text-anchor="middle" font-size="12" fill="#374151" font-weight="400">operator E-stop is local</text>
<rect x="615" y="550" width="200" height="60" rx="7" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
<text x="715.0" y="569" text-anchor="middle" font-size="13" fill="#15803d" font-weight="600">Confirm stop</text>
<text x="715.0" y="586" text-anchor="middle" font-size="12" fill="#374151" font-weight="400">invalidate old dispatch</text>
<text x="715.0" y="603" text-anchor="middle" font-size="12" fill="#374151" font-weight="400">clear queued policy work</text>
<line x1="260" y1="580" x2="335" y2="580" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#stop)"/>
<text x="297.5" y="566" text-anchor="middle" font-size="10" fill="#b91c1c" font-weight="400">cancel</text>
<line x1="535" y1="580" x2="615" y2="580" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#stop)"/>
<text x="575.0" y="566" text-anchor="middle" font-size="10" fill="#b91c1c" font-weight="400">stop</text>
<rect x="615" y="650" width="200" height="60" rx="7" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
<text x="715.0" y="669" text-anchor="middle" font-size="13" fill="#15803d" font-weight="600">Execution terminal</text>
<text x="715.0" y="686" text-anchor="middle" font-size="12" fill="#374151" font-weight="400">completed / cancelled / fault</text>
<rect x="335" y="650" width="200" height="60" rx="7" fill="#ffffff" stroke="#1a4d8f" stroke-width="1.5"/>
<text x="435.0" y="669" text-anchor="middle" font-size="13" fill="#1a4d8f" font-weight="600">Record terminal state</text>
<text x="435.0" y="686" text-anchor="middle" font-size="12" fill="#374151" font-weight="400">retain raw session events</text>
<rect x="80" y="650" width="180" height="60" rx="7" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
<text x="170.0" y="669" text-anchor="middle" font-size="13" fill="#b45309" font-weight="600">Check + report outcome</text>
<text x="170.0" y="686" text-anchor="middle" font-size="12" fill="#374151" font-weight="400">fresh visual evidence</text>
<text x="170.0" y="703" text-anchor="middle" font-size="12" fill="#374151" font-weight="400">state uncertainty when needed</text>
<line x1="615" y1="680" x2="535" y2="680" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="575.0" y="666" text-anchor="middle" font-size="10" fill="#374151" font-weight="400">result</text>
<line x1="335" y1="680" x2="260" y2="680" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="297.5" y="666" text-anchor="middle" font-size="10" fill="#374151" font-weight="400">observe</text>
<text x="550" y="759" text-anchor="middle" font-size="13" fill="#0f2f5c" font-weight="600">A running policy does not wait for a model request; local stop and watchdog checks continue.</text>
<text x="550" y="783" text-anchor="middle" font-size="12" fill="#4b5563" font-weight="400">This path describes managed skills such as ACT. A terminal execution state alone does not establish task success.</text>
