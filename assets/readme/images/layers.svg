<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="535" viewBox="0 0 1010 535" role="img" aria-labelledby="title desc"><title id="title">NERV layered architecture</title><desc id="desc">Agent conversation delegates tasks to System 2. System 1 and Robot Runtime execute robot actions. World Control is a separate simulation interface. The host enforces ownership and lifecycle.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#7b9bc8"/></marker></defs><rect width="1010" height="535" rx="18" fill="#101820"/>
