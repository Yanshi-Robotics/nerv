<rect x="35" y="35" width="270" height="95" rx="10" fill="#1b2a38" stroke="#42617c"/><text x="53" y="72" fill="#edf5fc" font-family="sans-serif" font-size="20">NERV Agent</text><text x="53" y="101" fill="#b6c7d8" font-family="sans-serif" font-size="14">Conversation + auxiliary tools</text>
<rect x="365" y="35" width="270" height="95" rx="10" fill="#1b2a38" stroke="#42617c"/><text x="383" y="72" fill="#edf5fc" font-family="sans-serif" font-size="20">System 2</text><text x="383" y="101" fill="#b6c7d8" font-family="sans-serif" font-size="14">Task planning + supervision</text>
<rect x="365" y="210" width="270" height="95" rx="10" fill="#1b2a38" stroke="#42617c"/><text x="383" y="247" fill="#edf5fc" font-family="sans-serif" font-size="20">System 1</text><text x="383" y="276" fill="#b6c7d8" font-family="sans-serif" font-size="14">Bounded actions + policies</text>
<rect x="365" y="385" width="270" height="95" rx="10" fill="#1b2a38" stroke="#42617c"/><text x="383" y="422" fill="#edf5fc" font-family="sans-serif" font-size="20">Robot Runtime</text><text x="383" y="451" fill="#b6c7d8" font-family="sans-serif" font-size="14">Device + sensors + local stop</text>
