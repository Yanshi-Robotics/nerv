<rect x="705" y="385" width="270" height="95" rx="10" fill="#1b2a38" stroke="#42617c"/><text x="723" y="422" fill="#edf5fc" font-family="sans-serif" font-size="20">World Runtime</text><text x="723" y="451" fill="#b6c7d8" font-family="sans-serif" font-size="14">Physics + operator views</text>
<rect x="35" y="210" width="270" height="95" rx="10" fill="#1b2a38" stroke="#42617c"/><text x="53" y="247" fill="#edf5fc" font-family="sans-serif" font-size="20">Shared harness interfaces</text><text x="53" y="276" fill="#b6c7d8" font-family="sans-serif" font-size="14">Independent memory + models</text>
<rect x="35" y="385" width="270" height="95" rx="10" fill="#1b2a38" stroke="#42617c"/><text x="53" y="422" fill="#edf5fc" font-family="sans-serif" font-size="20">NERV Host</text><text x="53" y="451" fill="#b6c7d8" font-family="sans-serif" font-size="14">Ownership + events + lifecycle</text>
<text x="505" y="515" text-anchor="middle" fill="#b6c7d8" font-family="sans-serif" font-size="14">Separate role contexts · One robot / environment · One action owner · ultimate remains a future goal</text></svg>
