<!-- SVG-DESIGN-NOTES Type: A. Q0: Edge Brain and remote supervision reuse MCP without replacing Host tasks.. Q1: Solid local lane and dashed future lanes distinguish availability from deployment intent.. Q2: Explicit robot execution and authority boundaries. Q3: No decorative pictograms. Q4: Labels adjacent to their paths. Q5: Shared bilingual geometry; opaque light background for GitHub themes. -->
