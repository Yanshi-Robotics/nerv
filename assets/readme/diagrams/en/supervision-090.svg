<!-- SVG-DESIGN-NOTES Type: C. Q0: A live transport is not evidence of model supervision.. Q1: Three lifelines distinguish delivery, acknowledgement, execution and local timeout.. Q2: Explicit robot execution and authority boundaries. Q3: No decorative pictograms. Q4: Labels adjacent to their paths. Q5: Shared bilingual geometry; opaque light background for GitHub themes. -->
