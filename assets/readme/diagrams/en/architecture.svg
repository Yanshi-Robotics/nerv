<text x="120" y="647" font-size="22" style="fill:#23343b" font-weight="600" text-anchor="start">Shared foundation · Host + Runtime</text>
<text x="66" y="688" font-size="20" style="fill:#23343b" font-weight="400" text-anchor="start">Control grants   /   Action validation   /   Scheduling   /   Stop   /   Event journal</text>
<text x="66" y="723" font-size="17" style="fill:#5c7078" font-weight="400" text-anchor="start">Runtime supplies timestamped observations and measured feedback to the UI and controllers.</text>
