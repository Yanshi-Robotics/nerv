<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
<title id="title">Three layers, one managed execution path</title><desc id="desc">Layers define responsibilities. Fixed policies bypass the decision model.</desc>
