# NERV world · alice-house apt2: a two-storey Manhattan penthouse, simulated in MuJoCo.
name: apt2
kind: sim
engine: mujoco
label: Manhattan duplex penthouse (alice-house apt2)
assets_root: "${ALICE_HOUSE_ROOT}"
python: "${NERV_SIM_PYTHON}"
supports:
  humanoid-unitree-g1: build/apt2-g1.xml          # the arena alice-house built for the G1
spawn:
  scene: apt2
  source: layout                                   # ROBOT_HOME_XY / START_POS_XY from scenes/apt2/layout.py
ambient: []                                        # no fixed cameras in this world
physics:
  dt: 0.002
  realtime_factor: 1.0
  render_width: 640
  render_height: 480
  stream_fps: 12
  third_person: true
