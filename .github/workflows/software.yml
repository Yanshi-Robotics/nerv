name: Software contracts
on: [push, pull_request]
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.2'
          enable-cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify in managed storage
        id: candidate
        run: python scripts/ci_managed.py
      - name: Check source checkout remains free of build dependencies
        run: python scripts/check_source_clean.py
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.os }}
          path: ${{ steps.candidate.outputs.bundle }}/nerv-*-bundle.zip
