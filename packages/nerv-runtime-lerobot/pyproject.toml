[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nerv-runtime-lerobot"
version = "0.6.0"
description = "LeRobot 0.6.1 device and native ACT adapter for NERV"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["nerv-runtime-sdk==0.6.0", "lerobot==0.6.1"]

[project.entry-points."nerv.runtime_providers"]
"lerobot0.6.1" = "nerv_runtime_lerobot:LeRobotProvider"

[tool.setuptools.packages.find]
where = ["src"]
