<?xml version="1.0" encoding="UTF-8"?>
<!-- SVG-DESIGN-NOTES
Type: C (process) — swimlane sequence, time flows downward
Q0 One Big Idea: one instruction runs on two clocks — the brain steps once per LLM call, the body
   loops at 30–50 Hz against a 500 Hz world — and the two clocks meet only inside NERV.
Q1 Geometry: four lanes = four clocks; every arrow crossing a lane boundary is a message; the
   tall Body box with an inner loop shows the policy loop running without waiting for the LLM.
Q2 DNA: without the title, the ①②③④ column plus the tall loop box on the right still reads as
   "slow step on the left, fast loop on the right, a gate in between".
Q3 Removed: no icons, no shadows, no gradients; dashed only for feedback (heartbeat, refusal).
Q4 Labels sit on the arrow they name; lane headers carry the clock rate.
Q5 Standalone README image: explicit hex fills, dark text on light lanes.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700"
     font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
     font-size="12.5" fill="#1f2937">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#374151"/>
    </marker>
    <marker id="arrFb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6b7280"/>
    </marker>
    <marker id="arrRef" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="700" fill="#f8f9fb"/>

  <!-- ===== Lanes ===== -->
  <g id="lanes">
    <rect x="20"  y="58" width="270" height="562" rx="8" fill="#fdf2e9" stroke="#e7c9ad" stroke-width="1"/>
    <rect x="300" y="58" width="270" height="562" rx="8" fill="#e8f0fe" stroke="#b7ccec" stroke-width="1"/>
    <rect x="580" y="58" width="270" height="562" rx="8" fill="#e9f7ef" stroke="#b5dcc4" stroke-width="1"/>
    <rect x="860" y="58" width="220" height="562" rx="8" fill="#f3f0fa" stroke="#cbbfe8" stroke-width="1"/>

    <!-- headers -->
    <rect x="20"  y="14" width="270" height="38" rx="8" fill="#b45309"/>
    <text x="155" y="32" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">System 2 · Brain</text>
    <text x="155" y="46" text-anchor="middle" font-size="11" fill="#fde8d3">once per step (one LLM call)</text>

    <rect x="300" y="14" width="270" height="38" rx="8" fill="#1a4d8f"/>
    <text x="435" y="32" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">NERV</text>
    <text x="435" y="46" text-anchor="middle" font-size="11" fill="#d6e4f7">route · gate · assemble · log</text>

    <rect x="580" y="14" width="270" height="38" rx="8" fill="#15803d"/>
    <text x="715" y="32" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">System 1 · Body</text>
    <text x="715" y="46" text-anchor="middle" font-size="11" fill="#d3f0dc">policy loop · 30–50 Hz</text>

    <rect x="860" y="14" width="220" height="38" rx="8" fill="#6d28d9"/>
    <text x="970" y="32" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">World</text>
    <text x="970" y="46" text-anchor="middle" font-size="11" fill="#e4dcf7">500 Hz physics / reality</text>

    <!-- lifelines -->
    <line x1="155" y1="66" x2="155" y2="612" stroke="#d6b08a" stroke-width="1" stroke-dasharray="3 4"/>
    <line x1="435" y1="66" x2="435" y2="612" stroke="#9db6dc" stroke-width="1" stroke-dasharray="3 4"/>
    <line x1="715" y1="66" x2="715" y2="612" stroke="#95c7a8" stroke-width="1" stroke-dasharray="3 4"/>
    <line x1="970" y1="66" x2="970" y2="612" stroke="#b6a6e0" stroke-width="1" stroke-dasharray="3 4"/>
  </g>

  <!-- ===== Row 0: instruction enters ===== -->
  <rect x="335" y="72" width="200" height="30" rx="6" fill="#ffffff" stroke="#1a4d8f" stroke-width="1.4"/>
  <text x="435" y="91" text-anchor="middle" font-size="12" fill="#0f2f5c">human: “put the block in the box”</text>
  <line x1="335" y1="87" x2="160" y2="87" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="248" y="82" text-anchor="middle" font-size="11.5" fill="#374151">user_message</text>

  <!-- ===== ① SEE ===== -->
  <circle cx="60" cy="129" r="11" fill="#b45309"/>
  <text x="60" y="133" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>
  <text x="60" y="152" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7c2d12">SEE</text>

  <rect x="80" y="114" width="180" height="30" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/>
  <text x="170" y="133" text-anchor="middle" font-size="12.5" font-weight="600">observe</text>
  <line x1="260" y1="129" x2="333" y2="129" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="335" y="114" width="200" height="120" rx="6" fill="#ffffff" stroke="#1a4d8f" stroke-width="1.4"/>
  <text x="435" y="133" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f2f5c">assemble observation</text>
  <text x="345" y="166" font-size="11.5" fill="#1f2937">from the body:</text>
  <text x="345" y="180" font-size="11" fill="#4b5563">   joints · wrist camera</text>
  <text x="345" y="210" font-size="11.5" fill="#1f2937">from the world stream:</text>
  <text x="345" y="224" font-size="11" fill="#4b5563">   top camera (ambient)</text>

  <!-- Body observation box and bus read -->
  <rect x="615" y="150" width="200" height="44" rx="6" fill="#ffffff" stroke="#15803d" stroke-width="1.4"/>
  <text x="715" y="168" text-anchor="middle" font-size="12" font-weight="600" fill="#14532d">nerv://observation</text>
  <text x="715" y="184" text-anchor="middle" font-size="11" fill="#4b5563">joints · wrist camera · summary</text>
  <line x1="615" y1="172" x2="537" y2="172" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="880" y="150" width="180" height="44" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="1.4"/>
  <text x="970" y="168" text-anchor="middle" font-size="12" font-weight="600" fill="#3b1d8a">physics / servos</text>
  <text x="970" y="184" text-anchor="middle" font-size="11" fill="#4b5563">+ on-body camera</text>
  <line x1="880" y1="172" x2="817" y2="172" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="848" y="166" text-anchor="middle" font-size="10.5" fill="#374151">bus read</text>

  <!-- World ambient sensor stream straight to NERV -->
  <rect x="880" y="204" width="180" height="30" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="1.4"/>
  <text x="970" y="223" text-anchor="middle" font-size="12" font-weight="600" fill="#3b1d8a">top camera (ambient)</text>
  <line x1="880" y1="219" x2="537" y2="219" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="715" y="213" text-anchor="middle" font-size="10.5" fill="#374151">nerv://sensors/top — sensors only, never ground truth</text>

  <!-- observation back to brain -->
  <line x1="335" y1="250" x2="160" y2="250" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="248" y="245" text-anchor="middle" font-size="11.5" fill="#374151">observation</text>

  <!-- ===== ② THINK ===== -->
  <circle cx="60" cy="289" r="11" fill="#b45309"/>
  <text x="60" y="293" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2</text>
  <text x="60" y="312" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7c2d12">THINK</text>

  <rect x="80" y="268" width="180" height="44" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/>
  <text x="170" y="286" text-anchor="middle" font-size="12.5" font-weight="600">one LLM call</text>
  <text x="170" y="302" text-anchor="middle" font-size="11" fill="#4b5563">returns say or call_tool</text>
  <line x1="260" y1="289" x2="305" y2="289" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="282" y="283" text-anchor="middle" font-size="10.5" fill="#374151">call_tool</text>

  <!-- ===== ③ GATE ===== -->
  <circle cx="318" cy="289" r="11" fill="#1a4d8f"/>
  <text x="318" y="293" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3</text>
  <text x="318" y="312" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f2f5c">GATE</text>

  <rect x="335" y="268" width="200" height="44" rx="6" fill="#ffffff" stroke="#1a4d8f" stroke-width="1.4"/>
  <text x="435" y="286" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f2f5c">grasp(target)</text>
  <text x="435" y="302" text-anchor="middle" font-size="11" fill="#4b5563">armed? allowed? in range?</text>

  <!-- refusal: dashed back to brain -->
  <line x1="335" y1="326" x2="160" y2="326" stroke="#b91c1c" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrRef)"/>
  <text x="248" y="340" text-anchor="middle" font-size="10.5" fill="#b91c1c">refused: tool_result {error}, no motion</text>

  <!-- allowed: to body -->
  <line x1="535" y1="289" x2="613" y2="289" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="575" y="283" text-anchor="middle" font-size="10.5" fill="#374151">allowed</text>

  <!-- ===== ④ ACT ===== -->
  <circle cx="598" cy="318" r="11" fill="#15803d"/>
  <text x="598" y="322" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">4</text>
  <text x="598" y="341" text-anchor="middle" font-size="10.5" font-weight="700" fill="#14532d">ACT</text>

  <rect x="615" y="268" width="200" height="176" rx="6" fill="#ffffff" stroke="#15803d" stroke-width="1.4"/>
  <text x="715" y="286" text-anchor="middle" font-size="12.5" font-weight="600" fill="#14532d">skill grasp: policy loop</text>
  <!-- inner loop -->
  <rect x="627" y="298" width="176" height="106" rx="6" fill="#e9f7ef" stroke="#15803d" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="715" y="315" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">every 20–33 ms</text>
  <text x="715" y="333" text-anchor="middle" font-size="11">read sensors</text>
  <text x="715" y="349" text-anchor="middle" font-size="11">› policy (ACT / gait)</text>
  <text x="715" y="365" text-anchor="middle" font-size="11">› joint targets</text>
  <text x="715" y="381" text-anchor="middle" font-size="11">› bus write</text>
  <text x="715" y="397" text-anchor="middle" font-size="10.5" fill="#4b5563">loops; never waits for the LLM</text>
  <text x="715" y="426" text-anchor="middle" font-size="11" fill="#4b5563">until done / timeout / stop</text>

  <!-- body <-> world bus during the loop -->
  <rect x="880" y="318" width="180" height="60" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="1.4"/>
  <text x="970" y="337" text-anchor="middle" font-size="12" font-weight="600" fill="#3b1d8a">physics steps</text>
  <text x="970" y="353" text-anchor="middle" font-size="11" fill="#4b5563">servos turn · cameras</text>
  <text x="970" y="368" text-anchor="middle" font-size="11" fill="#4b5563">× N per loop tick</text>
  <line x1="817" y1="332" x2="878" y2="332" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="848" y="326" text-anchor="middle" font-size="10.5" fill="#374151">bus write</text>
  <line x1="878" y1="364" x2="817" y2="364" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="848" y="378" text-anchor="middle" font-size="10.5" fill="#374151">bus read</text>

  <!-- heartbeats: dashed to NERV -->
  <rect x="335" y="352" width="200" height="60" rx="6" fill="#ffffff" stroke="#1a4d8f" stroke-width="1.4"/>
  <text x="435" y="371" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f2f5c">monitor</text>
  <text x="435" y="387" text-anchor="middle" font-size="11" fill="#4b5563">heartbeats › log › SSE to human</text>
  <text x="435" y="402" text-anchor="middle" font-size="11" fill="#4b5563">operator stop › stops the skill</text>
  <line x1="613" y1="366" x2="537" y2="366" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrFb)"/>
  <line x1="613" y1="384" x2="537" y2="384" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrFb)"/>
  <text x="575" y="360" text-anchor="middle" font-size="10.5" fill="#4b5563">progress</text>
  <text x="575" y="398" text-anchor="middle" font-size="10.5" fill="#4b5563">progress</text>

  <!-- tool_result -->
  <line x1="613" y1="462" x2="537" y2="462" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="335" y="447" width="200" height="30" rx="6" fill="#ffffff" stroke="#1a4d8f" stroke-width="1.4"/>
  <text x="435" y="466" text-anchor="middle" font-size="12" fill="#0f2f5c">tool_result {ok, measured…}</text>
  <line x1="335" y1="462" x2="160" y2="462" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="248" y="457" text-anchor="middle" font-size="11.5" fill="#374151">tool_result</text>

  <!-- loop back to ① on the brain lane -->
  <path d="M155 470 L155 486 Q155 494 147 494 L40 494 Q32 494 32 486 L32 137 Q32 129 40 129 L47 129"
        fill="none" stroke="#b45309" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="80" y="512" font-size="11.5" fill="#7c2d12" font-weight="600">loop: back to step 1 until end_turn</text>
  <rect x="80" y="522" width="180" height="42" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="170" y="539" text-anchor="middle" font-size="11" fill="#4b5563">three stops, in priority:</text>
  <text x="170" y="555" text-anchor="middle" font-size="11" fill="#1f2937">interrupt &gt; steps &gt; wall clock</text>

  <!-- end_turn: say to human -->
  <rect x="80" y="576" width="180" height="30" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/>
  <text x="170" y="595" text-anchor="middle" font-size="12.5" font-weight="600">end_turn: say “done”</text>
  <line x1="260" y1="591" x2="333" y2="591" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="297" y="585" text-anchor="middle" font-size="10.5" fill="#374151">say</text>
  <rect x="335" y="576" width="200" height="30" rx="6" fill="#ffffff" stroke="#1a4d8f" stroke-width="1.4"/>
  <text x="435" y="595" text-anchor="middle" font-size="12" fill="#0f2f5c">to the human (SSE) · logged</text>

  <!-- ===== Captions ===== -->
  <text x="550" y="646" text-anchor="middle" font-size="13" font-weight="600" fill="#0f2f5c">The two clocks meet only inside NERV.</text>
  <text x="550" y="666" text-anchor="middle" font-size="12" fill="#4b5563">The brain only sends intent and only sees sensors; the policy loop never waits for the LLM.</text>
  <text x="550" y="684" text-anchor="middle" font-size="11" fill="#6b7280">G1: move_forward(2) takes the same path — the gait policy at 50 Hz turns “2 m” into velocity commands and reports the measured displacement.</text>
</svg>
