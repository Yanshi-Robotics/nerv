# NERV body · Unitree G1 (29 DoF). Family `humanoid`: skills driven by a released gait policy.
name: humanoid-unitree-g1
family: humanoid
policy_robot: unitree/g1/dof29
label: Unitree G1 humanoid (29 DoF)
version: "1"
sensors:
  - {name: "camera:head", camera: "head_front", description: "forward camera on the head"}
skills:
  move_forward: {policy: "managed:g1-29dof-turn", description: "walk forward a distance"}
  turn_left:    {policy: "managed:g1-29dof-turn", description: "turn left on the spot"}
  turn_right:   {policy: "managed:g1-29dof-turn", description: "turn right on the spot"}
actuators:
  source: contract                 # joint order, kp/kd, torque limits come from the policy contract.json
  pd_mode: release                 # taken from release.yaml (implicit for this policy)
  start_height: 0.80               # spawn root height (m), matches the contract's default root pose
  foot_bodies: [left_ankle_roll_link, right_ankle_roll_link]
  standing_balance:               # simulation only; sensor-local model feedback, no model training
    model: robots/g1/g1.xml
    model_sha256: 2170db4ad90406d45ed71a8df3083ab1200c263b1f40d0ec15f7198e320e02a5
    foot_bodies: [left_ankle_roll_link, right_ankle_roll_link]
    horizon_s: 20                 # finite-horizon control design, not an infinite stability claim
    design_timeout_s: 5
    derivative_epsilon: 0.000001  # MuJoCo transition finite difference
    balance_cost: 1000            # COM relative to support; official MuJoCo LQR construction
    posture_cost: {hip: 3, knee: 3, ankle: 3, waist: 3, default: 0.3}
  chase_body: torso_link
  chase_back_m: 2.6
  chase_up_m: 1.7
locomotion:
  walk_speed: 0.6                  # vx (m/s) for move_forward — the policy was tuned at 0.6
  turn_rate: 0.8                   # wz (rad/s) for turns — inside the trained ±0.8
  min_move_m: 0.5                 # 0.9.1 CPU probes: smaller steps are not qualified
  max_move_m: 3.0
  max_turn_deg: 180
  default_move_m: 1.0
  default_turn_deg: 45
  settle_s: 0.6
  lidar_range_m: 8.0
  brake_margin_m: 0.35             # measured ~0.21 m settling travel + 0.1 s scan cadence at 0.6 m/s
  brake_cone_deg: 40
  clearance:
    horizon_m: 0.65               # look ahead beyond the live body envelope
    sample_spacing_m: 0.08        # maximum lateral/ground sampling interval
    height_spacing_m: 0.04        # fill between named levels to detect thin tables/shelves
    height_offsets_m: [0.08, 0.28, 0.60, 0.95, 1.20] # above measured sole height
    envelope_margin_m: 0.04       # allow small gait sway beyond current collision geometry
    max_drop_m: 0.08              # flat-ground policy: reject stairs and pool edges
    max_rise_m: 0.03              # flat gait stops before low curbs; 7.5 cm pool coping caused a fall
    support_probe_margin_m: 0.05  # start downward rays above allowed floor variation
    support_seam_tolerance_m: 0.002 # all four 2 mm neighbours must support an exact box seam
    scan_period_s: 0.10           # recheck motion in simulation time, independently of 50 Hz policy
  stall_timeout_s: 1.5
  fall_tilt_rad: 0.8
  fall_height_m: 0.18
  # Candidate-06 turn needed ~1.79 s including the unchanged quiet interval.
  # Ceil(2 * 1.79) = 4 s; normal action settling only, still bounded by supervision.
  motion_settle_s: 4.0
  hold_settle_s: 1.5               # emergency stop: up to this long (sim s) to come to a stand before entering supervised balance
  hold_still_rad_s: 0.3            # every joint must remain below this during the quiet interval
  hold_linear_m_s: 0.05          # unchanged sensor bound, qualified in scoped CPU holding probes
  hold_angular_rad_s: 0.1        # unchanged sensor bound; not a hardware qualification
  hold_still_s: 0.2                # ten 50 Hz policy frames below the velocity bound before entering supervised balance
buses:
  sim:
    settings:
      external_supervision:
        version: g1-apt-cpu-mcp-091-2
        scenes: [apt]
        timeout_s: 20
        max_observation_age_s: 40  # six MCP visual-processing samples; twice observed maximum, rounded up to 5 s
        poll_s: 0.05
      skill_transitions:
        version: g1-apt-cpu-091-standing-1
        validated: true # Scoped source engineering qualification; installed navigation remains separate
        scope: simulation-software
        scenes: [apt]
        pairs: [[move_forward, turn_left], [move_forward, turn_right], [turn_left, move_forward], [turn_left, turn_right], [turn_right, move_forward], [turn_right, turn_left]]
        physics_dt_s: 0.002
        policy_dt_s: 0.02
        profile_sha256: dae8564963067034f9793b7a5ed31ecc9d19e3bc607a12d110d9154667173174
        implementation_sha256:
          body/balance.py: 0ef5b0080354addc2a3c5d3bc4721f71726cf7a76cd91fe90749c7f7268c328f
          body/families/humanoid.py: 98d78db3cb23344b078cbc14ade01c99fdac9d272800f53986c072005012776b
          body/stopping.py: 83755d28857c54e0eba8c74bad6ab8e81edb690dba1753754157eb24897308ff
          body/bus_zmq.py: 9bd1856c7311ed156209e82d3cb5e4eda235d9c8ae7b9978b7099fffd5bf3ea4
          runtime/builtin.py: b88e2cc5a2ff1e7b2904c64d208e9d1794328ec73c16f342afdd531c93afab5a
          world/mujoco_node.py: c23faa46d268fd16d5e52dbd04cc2facc9831e76dbfe5726143f6c53b42270e1
          world/composition.py: e51673676688fee8cbe0bceda3ca2b8a0f4c28960ea80a5335916eedd5a994e1
          world/bus_server.py: 736e3c994fdd7c24d634885c0080205426e3d54a7060badf5d7d7e1338963495
        dependency_versions:
          mujoco: 3.12.0
          numpy: 2.5.2
          onnxruntime: 1.31.0
        policy_sha256:
          policy.onnx: 07400671a8fffae172d261688bc84f0e60d3d656156b564dbdc0a4638fb695c6
          contract.json: 1fdbe2ecc5d60945b5b630074425b053dbbca058b6a55be91833697083c8d6ef
          release.yaml: 139f756341d744416b6823b9d99f6811dd1f9d85c6ca926a01729a2838c19ff8
    kind: zmq                      # runs in the same venv as NERV
  real:
    enabled: false                 # real hardware integration is outside 0.6
    kind: unitree
    verified: false                # interface written against lerobot.robots.unitree_g1; never run on hardware
    python: "${NERV_LEROBOT_PYTHON}"
    settings:
      robot_ip: "${G1_ROBOT_IP}"
