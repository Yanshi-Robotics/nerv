# SO-101: native LeRobot ACT in reality; position-controlled primitives in simulation.
name: arm-lerobot-so101
family: arm
label: SO-101 arm (LeRobot)
version: "1"
sensors:
  - {name: "camera:top", camera: "top", description: "fixed overhead camera"}
  - {name: "camera:wrist", camera: "wrist", description: "camera on the wrist (sim: MJCF camera 'wrist'; real: LeRobot camera key 'wrist')"}
skills:
  snack_into_box:
    modes: [real]
    artifact: snack_into_box
    manifest: artifacts/snack_into_box/artifact.json
    description: "Run the registered ACT continuously in its demonstrated scene. It can reattempt within one invocation. Observe top and wrist until the entire original snack bag is inside the original box, released, and the empty arm has returned to Rest. Initial object placement, camera geometry and calibration must match training. Do not restart this skill to manufacture retries; stop if conditions are unsuitable or success cannot be confirmed."
actuators:
  joints: [shoulder_pan, shoulder_lift, elbow_flex, wrist_flex, wrist_roll, gripper]
  gripper: gripper
  pd_mode: position_actuator      # sim: the SO-101 MJCF position actuators hold the target
  rate_hz: 50
  max_step_deg: 30                # a single nudge may not exceed this
  min_duration_s: 0.3
  max_duration_s: 10
  default_duration_s: 2.0
  settle_tol_deg: 2.0
buses:
  sim:
    enabled: true                  # workbench scenes verified locally; no simulated ACT claim
    kind: zmq                      # runs in the same venv as NERV
  real:
    kind: lerobot
    provider: lerobot0.6.1
    verified: false
    python: "${NERV_LEROBOT_PYTHON}"
    settings:
      use_degrees: true          # five arm joints in degrees; native gripper remains 0-100 percent
      robot_type: so101_follower
      port: "${SO101_PORT}"
      id: "${SO101_ID}"
      calibration_dir: "${SO101_CALIBRATION_DIR}"
      cameras: "${SO101_CAMERAS}"                 # e.g. "wrist=0,top=2" (key=device index)
      camera_config_file: "${SO101_CAMERA_CONFIG}"
      control_rate_hz: 30
      decision_max_age_s: 20
      decision_max_drift: 2
      min_duration_s: 0.3
      max_duration_s: 10
      max_step_deg: 30
      settle_tol: 2
      max_runtime_s: 45
      supervision_timeout_s: 20
      cancel_timeout_s: 5
      watchdog_poll_s: 0.05
      max_frame_age_s: 0.5
      max_action_age_s: 0.5
      policy_device: cuda
      jpeg_quality: 80
      disable_torque_on_disconnect: false
      max_relative_target: "${SO101_MAX_RELATIVE_TARGET}"
      gripper: gripper
